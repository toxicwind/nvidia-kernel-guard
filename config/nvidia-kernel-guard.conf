# nvidia-kernel-guard configuration
# DRIVER_FLAVOR: open (nvidia-open, recommended, default) or proprietary (nvidia)
DRIVER_FLAVOR=open
# AUTO_FIX: if yes, `nkg fix` runs without prompting (used by automation)
AUTO_FIX=no
# HOOK_AUTOFIX: if yes (default), the pacman hook's path unit automatically
# installs missing/skewed driver packages after the transaction completes.
# Runs post-transaction via nvidia-kernel-guard-autofix.service — never inside
# the pacman db lock. Set to no for warn-only behavior.
HOOK_AUTOFIX=yes
